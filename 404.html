<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — madboss.dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08050f">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center; padding: 24px;
    background: radial-gradient(60vmax 60vmax at 20% 0%, rgba(109, 40, 217, .55), transparent 60%),
                radial-gradient(50vmax 50vmax at 100% 60%, rgba(192, 38, 211, .3), transparent 60%),
                #08050f;
    color: #efe9ff;
    font: 15px/1.6 ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  .box { width: 100%; max-width: 560px; }
  h1 {
    font-size: clamp(4.5rem, 22vw, 9rem); line-height: 1; font-weight: 800; letter-spacing: -.06em;
    background: linear-gradient(100deg, #f6f2ff, #a855f7 60%, #e879f9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  pre {
    margin: 18px 0 26px; padding: 16px; white-space: pre-wrap; word-break: break-word;
    border: 1px solid rgba(167, 139, 250, .18); border-radius: 12px; background: rgba(14, 8, 28, .72);
    font: inherit;
  }
  .u { color: #e879f9; } .p { color: #8b5cf6; } .e { color: #f9a8d4; }
  a {
    display: inline-block; padding: 10px 16px; border-radius: 10px;
    color: #fff; text-decoration: none; font-weight: 600;
    background: linear-gradient(100deg, #7c3aed, #c026d3);
  }
  a:focus-visible { outline: 2px solid #e879f9; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <pre><span class="u">visitor@madboss</span>:<span class="p">~</span>$ cd <span id="path">/somewhere</span>
<span class="e">cd: no such file or directory</span></pre>
    <a href="/">cd ~</a>
  </div>
<script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
