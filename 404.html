<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · madboss.dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0a17">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0d0a17; --panel: #120e20; --side: #0e0a1a; --line: #241b3c;
    --ink: #ece6ff; --dim: #6f6496; --mute: #9a8fc2; --acc: #8b5cf6; --err: #f472b6;
    --kw: #c084fc; --fn: #f0abfc; --str: #a5b4fc; --num: #f9a8d4; --com: #6b5f91; --prop: #ddd6fe; --op: #8b7fb8;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --pad: clamp(10px, 3vw, 40px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh; display: grid; place-items: center; padding: var(--pad);
    background:
      radial-gradient(80vmax 60vmax at 85% -10%, rgba(124, 58, 237, .38), transparent 60%),
      radial-gradient(60vmax 50vmax at -10% 110%, rgba(190, 24, 93, .22), transparent 60%),
      var(--bg);
    color: var(--ink); font: 14px/1.7 var(--mono);
  }
  .win {
    position: relative; width: min(1120px, 100%);
    height: min(720px, calc(100svh - 2 * var(--pad)));
    display: grid; grid-template-rows: 38px 1fr 26px;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--panel);
    box-shadow: 0 40px 120px -30px rgba(91, 33, 182, .65), inset 0 1px 0 rgba(255, 255, 255, .03);
  }
  .title { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--side); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .title i { width: 11px; height: 11px; border-radius: 50%; }
  .title i:nth-child(1) { background: #a855f7; } .title i:nth-child(2) { background: #7c3aed; } .title i:nth-child(3) { background: #4c1d95; }
  .title span { flex: 1; text-align: center; margin-right: 50px; }
  .main { display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 14px 0; font-size: 13px; color: var(--mute); overflow: auto; }
  aside h6 { font: 600 11px var(--mono); letter-spacing: .14em; color: var(--dim); padding: 0 16px 10px; text-transform: uppercase; }
  aside div { padding: 2px 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside a { color: inherit; text-decoration: none; }
  aside a:hover { color: var(--ink); }
  aside div.on { background: rgba(244, 114, 182, .12); color: var(--err); box-shadow: inset 2px 0 0 var(--err); }
  aside .d { color: var(--kw); }
  aside .i1 { padding-left: 30px; } aside .i2 { padding-left: 46px; }
  .ed { display: grid; grid-template-rows: 36px 1fr auto; min-width: 0; min-height: 0; }
  .tabs { display: flex; background: var(--side); border-bottom: 1px solid var(--line); }
  .tab { padding: 0 18px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); border-right: 1px solid var(--line); }
  .tab.on { background: var(--panel); color: var(--err); box-shadow: inset 0 2px 0 var(--err); }
  .tab b { color: #a78bfa; font-size: 11px; }
  .tab.on b { color: var(--err); }
  .code { display: grid; grid-template-columns: 60px 1fr; overflow: auto; padding: 18px 0; font-size: clamp(13px, 1.45vw, 17px); line-height: 1.75; }
  .gut { color: #3f3463; text-align: right; padding-right: 20px; user-select: none; }
  .gut div.bad { color: var(--err); }
  pre { font: inherit; white-space: pre; color: var(--prop); }
  .k { color: var(--kw); } .f { color: var(--fn); } .s { color: var(--str); } .n { color: var(--num); }
  .c { color: var(--com); font-style: italic; } .p { color: var(--prop); } .o { color: var(--op); }
  .sq { text-decoration: underline wavy var(--err); text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .caret { display: inline-block; width: 2px; height: 1.25em; vertical-align: -.28em; background: #f0abfc; box-shadow: 0 0 12px #f0abfc; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .problems { border-top: 1px solid var(--line); background: var(--side); font-size: 12.5px; }
  .problems h6 { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); padding: 8px 16px 6px; display: flex; gap: 10px; align-items: center; }
  .problems h6 b { background: var(--err); color: #1a0716; border-radius: 999px; padding: 0 7px; font-size: 10.5px; letter-spacing: 0; }
  .problems p { padding: 4px 16px 12px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .problems p i { color: var(--err); font-style: normal; margin-right: 8px; }
  .problems p em { font-style: normal; color: var(--dim); margin-left: 8px; }
  .status { display: flex; align-items: center; gap: 18px; padding: 0 12px; background: linear-gradient(90deg, #9d174d, #a21caf); color: #fdf2f8; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .status .sp { flex: 1; }
  .toast {
    position: absolute; right: 18px; bottom: 112px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 12px 10px 14px; border: 1px solid #5b2a4e; border-radius: 10px; background: rgba(30, 14, 36, .96);
    color: var(--ink); font-size: 12.5px; box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .6);
    opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast i { width: 18px; height: 18px; border-radius: 50%; background: var(--err); display: grid; place-items: center; font-style: normal; font-size: 11px; color: #1a0716; font-weight: 700; }
  .toast a { color: #f5f3ff; background: #7c3aed; border-radius: 6px; padding: 4px 10px; text-decoration: none; }
  .toast a:hover, .toast a:focus-visible { background: #8b5cf6; outline: none; }
  @media (max-width: 720px) {
    .main { grid-template-columns: 1fr; } aside { display: none; }
    .status .hide { display: none; } .code { grid-template-columns: 38px 1fr; } .gut { padding-right: 10px; }
    .toast { left: 12px; right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="win">
    <div class="title" aria-hidden="true"><i></i><i></i><i></i><span>madboss.dev: 404</span></div>
    <div class="main">
      <aside aria-label="Files">
        <h6>Explorer</h6>
        <div class="d">▾ madboss.dev</div>
        <div class="i1 d">▾ src</div>
        <div class="i2"><a href="/">index.ts</a></div>
        <div class="i2 on" id="miss">✗ ???</div>
        <div class="i1 d">▸ playground</div>
        <div class="i1 d">▸ prototypes</div>
        <div class="i1">README.md</div>
      </aside>
      <section class="ed">
        <div class="tabs"><div class="tab on"><b>TS</b> 404.ts ●</div></div>
        <div class="code"><div class="gut" id="gut" aria-hidden="true"></div><pre id="src" aria-label="404: page not found"></pre></div>
        <div class="problems"><h6>Problems <b>1</b></h6><p><i>⊗</i><span id="err"></span><em>404.ts(2, 22)</em></p></div>
      </section>
    </div>
    <footer class="status"><span>⎇ main</span><span>⊗ 1 problem</span><span class="sp"></span><span>Ln 2, Col 22</span><span class="hide">UTF-8</span><span class="hide">TypeScript</span><span>madboss.dev</span></footer>
    <div class="toast" id="toast" role="status"><i>!</i>build failed · route not found<a href="/">&larr; back to madboss.dev</a></div>
  </div>
<script>
(() => {
  let path = location.pathname;
  try { path = decodeURIComponent(path); } catch (e) {}
  if (path.length > 60) path = path.slice(0, 57) + '...';
  const q = "'" + path + "'";
  const L = [
    [['c', '// 404: route not found']],
    [['k', 'import'], ['o', ' { '], ['p', 'page'], ['o', ' } '], ['k', 'from'], ['o', ' '], ['s sq', q]],
    [],
    [['c', '// it got built, then broken,']],
    [['c', '// and never built again.']],
    [],
    [['k', 'export default function'], ['o', ' '], ['f', 'lost'], ['o', '() {']],
    [['o', '  '], ['k', 'return'], ['o', ' '], ['f', 'goHome'], ['o', '('], ['s', "'/'"], ['o', ')'], ['c', ' // click the button']],
    [['o', '}']]
  ];
  const src = document.getElementById('src'), gut = document.getElementById('gut');
  document.getElementById('miss').textContent = '✗ ' + (path.split('/').filter(Boolean).pop() || '???');
  document.getElementById('err').textContent = `Cannot find module ${q}.`;
  L.forEach((line, i) => {
    for (const [cls, txt] of line) { const s = document.createElement('span'); s.className = cls; s.textContent = txt; src.appendChild(s); }
    if (i < L.length - 1) src.appendChild(document.createTextNode('\n'));
    const d = document.createElement('div'); d.textContent = i + 1; if (i === 1) d.className = 'bad'; gut.appendChild(d);
  });
  const caret = document.createElement('span'); caret.className = 'caret'; src.appendChild(caret);
  setTimeout(() => document.getElementById('toast').classList.add('show'), 350);
})();
</script>
</body>
</html>
