<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>madboss.dev</title>
<meta name="description" content="madboss.dev: a playground for ideas, prototypes and side quests.">
<meta name="theme-color" content="#050208">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://madboss.dev/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://madboss.dev/">
<meta property="og:title" content="madboss.dev">
<meta property="og:description" content="A playground for ideas, prototypes and side quests. Press any key.">
<meta name="twitter:card" content="summary">
<style>
  :root { --ph: #d8b4fe; --ph2: #f0abfc; --mono: "Cascadia Mono", "Consolas", ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { min-height: 100svh; background: #050208; display: grid; place-items: center; padding: clamp(8px, 2.5vw, 34px); overflow: hidden; }
  .bezel {
    width: min(1180px, 100%); height: min(760px, calc(100svh - 2 * clamp(8px, 2.5vw, 34px)));
    padding: clamp(10px, 1.6vw, 22px); border-radius: 28px;
    background: linear-gradient(160deg, #1a1426, #0c0912); box-shadow: 0 0 0 1px #261d36, 0 40px 120px -30px rgba(109, 40, 217, .55);
  }
  .screen {
    position: relative; height: 100%; overflow: hidden; border-radius: 22px / 26px;
    background: radial-gradient(ellipse at center, #1b0b2e 0%, #10061c 60%, #07030c 100%);
    box-shadow: inset 0 0 120px rgba(0, 0, 0, .9), inset 0 0 30px rgba(168, 85, 247, .2);
    animation: flick 4s infinite;
  }
  .screen.overdrive { animation: flick 4s infinite, hue 1.2s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  @keyframes flick { 0%, 100% { opacity: 1; } 47% { opacity: .97; } 48% { opacity: .9; } 49% { opacity: .98; } 80% { opacity: .96; } }
  .screen::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, .32) 0 2px, transparent 2px 4px);
  }
  .screen::after {
    content: ""; position: absolute; left: 0; right: 0; height: 120px; top: -120px; pointer-events: none; z-index: 3;
    background: linear-gradient(to bottom, transparent, rgba(216, 180, 254, .06), transparent);
    animation: roll 6s linear infinite;
  }
  @keyframes roll { to { top: 110%; } }
  .tty {
    position: relative; z-index: 1; height: 100%; overflow: hidden; padding: clamp(16px, 3vw, 40px);
    font: clamp(12px, 1.25vw, 16px)/1.55 var(--mono); color: var(--ph);
    text-shadow: 0 0 6px rgba(216, 180, 254, .75), 0 0 18px rgba(168, 85, 247, .45);
    white-space: pre-wrap; word-break: break-word; cursor: default; user-select: none;
  }
  .hi { color: var(--ph2); }
  .dimx { color: #8f6bbf; }
  .q { color: #e9d5ff; }
  .q .gt { color: var(--ph2); }
  .sys { color: var(--ph2); }
  .count { color: #6f4f99; }
  .art { font-size: clamp(4px, 1.12vw, 14px); line-height: 1.02; letter-spacing: 0; color: var(--ph2); white-space: pre; margin: 1.2em 0 .8em; text-shadow: 0 0 8px rgba(240, 171, 252, .9), 0 0 26px rgba(168, 85, 247, .6); }
  .cur { display: inline-block; width: .6em; height: 1.05em; vertical-align: -.15em; background: var(--ph2); box-shadow: 0 0 10px var(--ph2); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
  <div class="bezel"><div class="screen" id="screen"><div class="tty" id="tty" role="log" aria-live="polite"></div></div></div>
<script src="/quips.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches;
  const tty = document.getElementById('tty'), screen = document.getElementById('screen');
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const add = (html, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; tty.appendChild(d); return d; };
  const bottom = () => { tty.scrollTop = tty.scrollHeight; };

  /* block letters */
  const FONT = {
    M: ['█   █', '██ ██', '█ █ █', '█   █', '█   █'],
    A: [' ███ ', '█   █', '█████', '█   █', '█   █'],
    D: ['████ ', '█   █', '█   █', '█   █', '████ '],
    B: ['████ ', '█   █', '████ ', '█   █', '████ '],
    O: [' ███ ', '█   █', '█   █', '█   █', ' ███ '],
    S: [' ████', '█    ', ' ███ ', '    █', '████ ']
  };
  const banner = word => {
    const rows = [];
    for (let r = 0; r < 5; r++) rows.push([...word].map(ch => FONT[ch][r].replace(/./g, c => c === '█' ? '██' : '  ')).join('  '));
    return rows.join('\n');
  };

  /* the deck: every quip once, in random order, then reshuffle */
  const QUIPS = (window.QUIPS && window.QUIPS.length) ? window.QUIPS : ['the joke file failed to load. that is the joke.'];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let deck = shuffle(QUIPS.slice()), pos = 0, seen = 0, lastQuip = null;
  const draw = () => {
    if (pos >= deck.length) {
      deck = shuffle(QUIPS.slice()); pos = 0; seen = 0;
      if (deck[0] === lastQuip && deck.length > 1) [deck[0], deck[1]] = [deck[1], deck[0]];
      return { sys: `*** you have seen all ${QUIPS.length}. respect. reshuffling the deck. ***` };
    }
    lastQuip = deck[pos++]; seen++;
    return { text: lastQuip };
  };

  const boot = [
    ['hi', 'MADBOSS BIOS v0.1'], ['dimx', '(c) 2026 madboss.dev. all rights reversed.'], ['', ''],
    ['', 'CPU ........ imagination @ 4.20 GHz'], ['', 'MEMORY ..... 65536K OK'], ['', 'GPU ........ purple, lots of it'],
    ['', `JOKES ...... ${QUIPS.length} loaded, shuffled`], ['', ''],
    ['', 'loading playground.sys ......... <span class="hi">OK</span>'], ['', 'mounting /dev/purple ........... <span class="hi">OK</span>'],
    ['', 'starting side-quests.service ... <span class="hi">OK</span>']
  ];

  let ready = false, log, counter, typing = null;

  const finishTyping = () => { if (typing) { typing.el.textContent = typing.full; typing.done = true; typing = null; } };
  const typeOut = async (el, full) => {
    const job = { el, full, done: false }; typing = job;
    if (reduce) { finishTyping(); return; }
    for (let i = 1; i <= full.length; i++) {
      if (job.done) return;
      el.textContent = full.slice(0, i); bottom();
      await new Promise(r => setTimeout(r, 9));
    }
    job.done = true; if (typing === job) typing = null;
  };

  const say = item => {
    finishTyping();
    const line = document.createElement('div');
    if (item.sys) { line.className = 'sys'; line.textContent = item.sys; log.appendChild(line); }
    else {
      line.className = 'q';
      const gt = document.createElement('span'); gt.className = 'gt'; gt.textContent = '> ';
      const tx = document.createElement('span'); line.append(gt, tx); log.appendChild(line);
      typeOut(tx, item.text);
    }
    while (log.children.length > 80) log.removeChild(log.firstChild);
    counter.textContent = ` [${seen}/${QUIPS.length}]`;
    bottom();
  };

  /* konami code */
  const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
  let ki = 0;
  const checkKonami = key => {
    ki = key === KONAMI[ki] ? ki + 1 : (key === KONAMI[0] ? 1 : 0);
    if (ki === KONAMI.length) {
      ki = 0;
      say({ sys: '*** cheat code accepted. +30 lives. purple overdrive engaged. ***' });
      screen.classList.add('overdrive'); setTimeout(() => screen.classList.remove('overdrive'), 6000);
      return true;
    }
    return false;
  };

  const press = () => { if (ready) say(draw()); };

  addEventListener('keydown', e => {
    if (!ready || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab', 'Fn'].includes(e.key)) return;
    if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
    if (checkKonami(e.key.toLowerCase())) return;
    press();
  });
  addEventListener('pointerdown', e => { if (e.button === 0) press(); });

  (async () => {
    await wait(500);
    for (const [cls, txt] of boot) { add(txt || '&nbsp;', cls); bottom(); await wait(txt ? 170 : 90); }
    await wait(350);
    add(banner('MADBOSS'), 'art');
    add('&gt; a playground for ideas, prototypes &amp; side quests.', 'hi');
    add('&nbsp;');
    log = add('', 'log');
    const prompt = add(`${touch ? 'tap anywhere' : 'press any key'} to continue <span class="cur"></span><span class="count"></span>`);
    counter = prompt.querySelector('.count');
    bottom();
    ready = true;
  })();
})();
</script>
</body>
</html>
