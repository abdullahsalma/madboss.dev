<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>madboss.dev</title>
<meta name="description" content="madboss.dev: a playground for ideas, prototypes and side quests.">
<meta name="theme-color" content="#0d0a17">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://madboss.dev/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://madboss.dev/">
<meta property="og:title" content="madboss.dev">
<meta property="og:description" content="A playground for ideas, prototypes and side quests.">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #0d0a17; --panel: #120e20; --side: #0e0a1a; --line: #241b3c;
    --ink: #ece6ff; --dim: #6f6496; --mute: #9a8fc2; --acc: #8b5cf6;
    --kw: #c084fc; --fn: #f0abfc; --str: #a5b4fc; --num: #f9a8d4; --com: #6b5f91; --prop: #ddd6fe; --op: #8b7fb8;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --pad: clamp(10px, 3vw, 40px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh; display: grid; place-items: center; padding: var(--pad);
    background:
      radial-gradient(80vmax 60vmax at 85% -10%, rgba(124, 58, 237, .38), transparent 60%),
      radial-gradient(60vmax 50vmax at -10% 110%, rgba(162, 28, 175, .22), transparent 60%),
      var(--bg);
    color: var(--ink); font: 14px/1.7 var(--mono);
  }
  .win {
    position: relative; width: min(1120px, 100%);
    height: min(720px, calc(100svh - 2 * var(--pad)));
    display: grid; grid-template-rows: 38px 1fr 26px;
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    background: var(--panel);
    box-shadow: 0 40px 120px -30px rgba(91, 33, 182, .65), inset 0 1px 0 rgba(255, 255, 255, .03);
  }
  .title { display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--side); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .title i { width: 11px; height: 11px; border-radius: 50%; }
  .title i:nth-child(1) { background: #a855f7; } .title i:nth-child(2) { background: #7c3aed; } .title i:nth-child(3) { background: #4c1d95; }
  .title span { flex: 1; text-align: center; margin-right: 50px; }
  .main { display: grid; grid-template-columns: 230px 1fr; min-height: 0; }
  aside { background: var(--side); border-right: 1px solid var(--line); padding: 14px 0; font-size: 13px; color: var(--mute); overflow: auto; }
  aside h6 { font: 600 11px var(--mono); letter-spacing: .14em; color: var(--dim); padding: 0 16px 10px; text-transform: uppercase; }
  aside div { padding: 2px 16px; white-space: nowrap; }
  aside div.on { background: rgba(139, 92, 246, .16); color: var(--ink); box-shadow: inset 2px 0 0 var(--acc); }
  aside .d { color: var(--kw); }
  aside .i1 { padding-left: 30px; } aside .i2 { padding-left: 46px; }
  .ed { display: grid; grid-template-rows: 36px 1fr; min-width: 0; min-height: 0; }
  .tabs { display: flex; background: var(--side); border-bottom: 1px solid var(--line); }
  .tab { padding: 0 18px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--dim); border-right: 1px solid var(--line); }
  .tab.on { background: var(--panel); color: var(--ink); box-shadow: inset 0 2px 0 var(--acc); }
  .tab b { color: #a78bfa; font-size: 11px; }
  .code { display: grid; grid-template-columns: 60px 1fr; overflow: auto; padding: 18px 0; font-size: clamp(13px, 1.45vw, 17px); line-height: 1.75; }
  .gut { color: #3f3463; text-align: right; padding-right: 20px; user-select: none; }
  .gut div.cur { color: var(--mute); }
  pre { font: inherit; white-space: pre; color: var(--prop); }
  .k { color: var(--kw); } .f { color: var(--fn); } .s { color: var(--str); } .n { color: var(--num); }
  .c { color: var(--com); font-style: italic; } .p { color: var(--prop); } .o { color: var(--op); }
  .caret { display: inline-block; width: 2px; height: 1.25em; vertical-align: -.28em; background: #f0abfc; box-shadow: 0 0 12px #f0abfc; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .status { display: flex; align-items: center; gap: 18px; padding: 0 12px; background: linear-gradient(90deg, #6d28d9, #a21caf); color: #f5f3ff; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .status .sp { flex: 1; }
  .toast {
    position: absolute; right: 18px; bottom: 44px; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border: 1px solid #3b2a5e; border-radius: 10px; background: rgba(24, 16, 44, .95);
    color: var(--ink); font-size: 12.5px; box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .6);
    opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast i { width: 18px; height: 18px; border-radius: 50%; background: #a855f7; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #fff; }
  @media (max-width: 720px) {
    .main { grid-template-columns: 1fr; } aside { display: none; }
    .status .hide { display: none; } .code { grid-template-columns: 38px 1fr; } .gut { padding-right: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="win">
    <div class="title" aria-hidden="true"><i></i><i></i><i></i><span>madboss.dev: playground</span></div>
    <div class="main">
      <aside aria-label="Files">
        <h6>Explorer</h6>
        <div class="d">▾ madboss.dev</div>
        <div class="i1 d">▾ src</div>
        <div class="i2 on">index.ts</div>
        <div class="i2">ideas.ts</div>
        <div class="i2">experiments.ts</div>
        <div class="i1 d">▸ playground</div>
        <div class="i1 d">▸ prototypes</div>
        <div class="i1">README.md</div>
        <div class="i1">package.json</div>
      </aside>
      <section class="ed">
        <div class="tabs"><div class="tab on"><b>TS</b> index.ts</div><div class="tab"><b>MD</b> README.md</div></div>
        <div class="code"><div class="gut" id="gut" aria-hidden="true"></div><pre id="src" aria-label="madboss.dev source code"></pre></div>
      </section>
    </div>
    <footer class="status"><span>⎇ main</span><span>✓ 0 problems</span><span class="sp"></span><span id="pos">Ln 1, Col 1</span><span class="hide">UTF-8</span><span class="hide">TypeScript</span><span>madboss.dev</span></footer>
    <div class="toast" id="toast" role="status"><i>✓</i>build succeeded · 0 errors · deployed to madboss.dev</div>
  </div>
<script>
(() => {
  const L = [
    [['c', '// madboss.dev: a playground for ideas']],
    [['k', 'import'], ['o', ' { '], ['p', 'ideas'], ['o', ', '], ['p', 'coffee'], ['o', ' } '], ['k', 'from'], ['o', ' '], ['s', "'./brain'"]],
    [],
    [['k', 'const'], ['o', ' '], ['p', 'madboss'], ['o', ' = {']],
    [['o', '  '], ['p', 'name'], ['o', ': '], ['s', "'madboss.dev'"], ['o', ',']],
    [['o', '  '], ['p', 'mode'], ['o', ': '], ['s', "'playground'"], ['o', ',']],
    [['o', '  '], ['p', 'status'], ['o', ': '], ['s', "'compiling'"], ['o', ',']],
    [['o', '  '], ['p', 'purple'], ['o', ': '], ['n', '0x8b5cf6'], ['o', ',']],
    [['o', '}']],
    [],
    [['k', 'export function'], ['o', ' '], ['f', 'build'], ['o', '(idea: '], ['k', 'string'], ['o', ') {']],
    [['o', '  '], ['k', 'return'], ['o', ' '], ['f', 'pilot'], ['o', '(idea).'], ['f', 'then'], ['o', '('], ['f', 'ship'], ['o', ')']],
    [['o', '}']],
    [],
    [['p', 'ideas'], ['o', '.'], ['f', 'forEach'], ['o', '('], ['f', 'build'], ['o', ') '], ['c', '// see what sticks']]
  ];
  const src = document.getElementById('src'), gut = document.getElementById('gut');
  const pos = document.getElementById('pos'), toast = document.getElementById('toast');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const caret = document.createElement('span'); caret.className = 'caret';
  let line = 1, col = 1;
  const drawGut = () => {
    gut.innerHTML = '';
    for (let i = 1; i <= line; i++) {
      const d = document.createElement('div'); d.textContent = i;
      if (i === line) d.className = 'cur';
      gut.appendChild(d);
    }
    pos.textContent = `Ln ${line}, Col ${col}`;
  };
  (async () => {
    src.appendChild(caret); drawGut();
    await wait(600);
    for (let li = 0; li < L.length; li++) {
      for (const [cls, txt] of L[li]) {
        const s = document.createElement('span'); s.className = cls; src.insertBefore(s, caret);
        if (reduce) { s.textContent = txt; col += txt.length; continue; }
        for (const ch of txt) { s.textContent += ch; col++; pos.textContent = `Ln ${line}, Col ${col}`; await wait(8 + Math.random() * 18); }
      }
      if (li < L.length - 1) { src.insertBefore(document.createTextNode('\n'), caret); line++; col = 1; drawGut(); await wait(110); }
    }
    drawGut();
    await wait(500);
    toast.classList.add('show');
  })();
})();
</script>
</body>
</html>
