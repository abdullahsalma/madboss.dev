<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>madboss.dev — coming soon</title>
<meta name="description" content="Something is compiling at madboss.dev. Check back soon.">
<meta name="theme-color" content="#08050f">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://madboss.dev/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://madboss.dev/">
<meta property="og:title" content="madboss.dev — coming soon">
<meta property="og:description" content="Something is compiling. Check back soon.">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #08050f;
    --ink: #efe9ff;
    --muted: #a597cf;
    --dim: #6e6296;
    --line: rgba(167, 139, 250, .18);
    --violet: #8b5cf6;
    --purple: #a855f7;
    --fuchsia: #e879f9;
    --lav: #c4b5fd;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(168, 85, 247, .45); color: #fff; }

  /* ---------- background ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .glow.a {
    width: 70vmax; height: 70vmax; left: -25vmax; top: -35vmax;
    background: radial-gradient(circle, rgba(109, 40, 217, .75) 0%, transparent 62%);
    animation: drift 20s ease-in-out infinite alternate;
  }
  .glow.b {
    width: 55vmax; height: 55vmax; right: -22vmax; top: 5vmax;
    background: radial-gradient(circle, rgba(192, 38, 211, .45) 0%, transparent 62%);
    animation: drift 26s ease-in-out infinite alternate-reverse;
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48vh;
    perspective: 340px; perspective-origin: 50% 0%;
    overflow: hidden;
  }
  .plane {
    position: absolute; left: -100%; width: 300%; bottom: 0; height: 320%;
    transform-origin: 50% 100%;
    transform: rotateX(72deg);
    background-image:
      linear-gradient(to right, rgba(168, 85, 247, .55) 1px, transparent 1px),
      linear-gradient(to top, rgba(168, 85, 247, .55) 1px, transparent 1px);
    background-size: 64px 64px;
    animation: run 2.4s linear infinite;
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 20%, transparent 70%);
            mask-image: linear-gradient(to top, #000 0%, #000 20%, transparent 70%);
  }
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .025) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  @keyframes run { to { background-position: 0 64px; } }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }

  /* ---------- top bar ---------- */
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 22px clamp(18px, 4vw, 44px);
  }
  .brand {
    display: inline-flex; align-items: center; gap: .6rem;
    color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -.01em;
  }
  .brand svg { width: 28px; height: 28px; display: block; }
  .pill {
    display: inline-flex; align-items: center; gap: .55rem;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: rgba(24, 14, 44, .55); backdrop-filter: blur(8px);
    color: var(--lav); font-size: 12.5px; letter-spacing: .04em;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--fuchsia);
    box-shadow: 0 0 0 0 rgba(232, 121, 249, .7);
    animation: ping 1.8s ease-out infinite;
  }
  @keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(232, 121, 249, 0); } 100% { box-shadow: 0 0 0 0 rgba(232, 121, 249, 0); } }

  /* ---------- hero ---------- */
  main {
    flex: 1;
    width: 100%; max-width: 980px; margin: 0 auto;
    padding: clamp(24px, 7vh, 80px) clamp(18px, 4vw, 44px) 40px;
  }
  .eyebrow { color: var(--purple); font-size: 14px; letter-spacing: .06em; }
  h1 {
    position: relative;
    margin: 10px 0 14px;
    font-size: clamp(3.1rem, 13vw, 8.6rem);
    line-height: .95; font-weight: 800; letter-spacing: -.055em;
    white-space: nowrap;
  }
  .grad {
    background: linear-gradient(100deg, #f6f2ff 0%, #d6c8ff 30%, #a855f7 62%, #e879f9 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(168, 85, 247, .35));
  }
  .tld { color: var(--dim); -webkit-text-fill-color: var(--dim); }
  .caret {
    display: inline-block; width: .42em; height: .78em; margin-left: .08em;
    vertical-align: -.04em; background: var(--fuchsia);
    box-shadow: 0 0 22px rgba(232, 121, 249, .6);
    animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  h1.glitch .grad { animation: glitch .38s steps(2) 1; }
  @keyframes glitch {
    0%   { transform: translate(0); text-shadow: none; }
    25%  { transform: translate(-3px, 1px); }
    50%  { transform: translate(3px, -1px); }
    75%  { transform: translate(-1px, 0); }
    100% { transform: translate(0); }
  }
  .lede { color: var(--muted); font-size: clamp(15px, 2vw, 18px); max-width: 34ch; }
  .lede b { color: var(--ink); font-weight: 600; }

  /* ---------- terminal ---------- */
  .term {
    margin-top: clamp(28px, 6vh, 52px);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    background: rgba(14, 8, 28, .72); backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px -20px rgba(76, 29, 149, .55), inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .term-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .02);
  }
  .term-bar i { width: 11px; height: 11px; border-radius: 50%; background: #3b2a5e; }
  .term-bar i:nth-child(1) { background: #a855f7; }
  .term-bar i:nth-child(2) { background: #7c3aed; }
  .term-bar i:nth-child(3) { background: #4c1d95; }
  .term-bar span { margin-left: 8px; color: var(--dim); font-size: 12.5px; }
  .term-body {
    height: 300px; overflow-y: auto; padding: 14px 16px 16px;
    cursor: text; scrollbar-width: thin; scrollbar-color: #3b2a5e transparent;
  }
  .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.55em; }
  .u { color: var(--fuchsia); }
  .p { color: var(--violet); }
  .ok { color: #c4b5fd; }
  .run { color: var(--fuchsia); }
  .warn { color: #f0abfc; }
  .err { color: #f9a8d4; }
  .muted { color: var(--dim); }
  .bar { color: var(--purple); letter-spacing: -.5px; }
  .f { color: var(--lav); }
  .ln b, .hint b { color: var(--ink); font-weight: 600; }
  .prompt { display: flex; align-items: baseline; gap: .6ch; }
  .prompt label { white-space: nowrap; }
  .prompt input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--ink); font: inherit; caret-color: var(--fuchsia);
  }
  .prompt[hidden] { display: none; }

  /* ---------- footer ---------- */
  footer {
    display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; justify-content: space-between;
    padding: 18px clamp(18px, 4vw, 44px) 24px;
    color: var(--dim); font-size: 12.5px;
  }

  @media (max-width: 560px) {
    body { font-size: 13.5px; }
    .term-body { height: 280px; padding: 12px; }
    .prompt input { font-size: 16px; }
    .pill { font-size: 11.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow a"></div>
    <div class="glow b"></div>
    <div class="floor"><div class="plane"></div></div>
    <div class="scan"></div>
  </div>

  <header class="top">
    <a class="brand" href="/" aria-label="madboss.dev home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c026d3"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><path d="M18 22 30 32 18 42" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 43h13" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/></svg>
      madboss.dev
    </a>
    <span class="pill"><span class="dot"></span>building</span>
  </header>

  <main>
    <p class="eyebrow">// coming soon</p>
    <h1 id="title" aria-label="madboss.dev"><span class="grad">madboss</span><span class="tld">.dev</span><span class="caret" aria-hidden="true"></span></h1>
    <p class="lede">Something is <b>compiling</b> in here.<br>Check back soon.</p>

    <section class="term" aria-label="Interactive terminal">
      <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>visitor@madboss: ~</span></div>
      <div class="term-body" id="term">
        <div id="out" role="log" aria-live="polite"></div>
        <form id="form" class="prompt" autocomplete="off" hidden>
          <label for="cmd"><span class="u">visitor@madboss</span>:<span class="p">~</span>$</label>
          <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="Type a command, try help">
        </form>
      </div>
    </section>
  </main>

  <footer>
    <span>&copy; <span id="yr">2026</span> madboss.dev</span>
    <span>v0.0.1-alpha &middot; status: compiling</span>
  </footer>

<script>
(() => {
  const out = document.getElementById('out');
  const form = document.getElementById('form');
  const input = document.getElementById('cmd');
  const term = document.getElementById('term');
  const title = document.getElementById('title');
  document.getElementById('yr').textContent = new Date().getFullYear();

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PS1 = '<span class="u">visitor@madboss</span>:<span class="p">~</span>$ ';
  const bar = (pct, w = 22) => { const n = Math.round(pct / 100 * w); return '█'.repeat(n) + '░'.repeat(w - n); };

  const line = (html, cls) => {
    const d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    out.appendChild(d);
    term.scrollTop = term.scrollHeight;
    return d;
  };

  const files = {
    'readme.md': 'madboss.dev\n-----------\nunder construction. new things are on the way.',
    'todo.txt': '[x] get the domain\n[x] pick a purple\n[ ] build the thing\n[ ] ship it',
    'secret-plans.txt': null
  };

  const cmds = {
    help: () => [
      'available commands:',
      '  <b>whoami</b>        who are you?',
      '  <b>status</b>        build progress',
      '  <b>ls</b>            list files',
      '  <b>cat</b> &lt;file&gt;    read a file',
      '  <b>echo</b> &lt;text&gt;   say something',
      '  <b>date</b>          what time is it',
      '  <b>coffee</b>        refuel',
      '  <b>clear</b>         clean slate'
    ].join('\n'),
    whoami: () => 'visitor: early, curious, and very welcome.',
    status: () => `<span class="run">[ .. ]</span> building the thing <span class="bar">${bar(72)}</span> 72%\n<span class="warn">[wait]</span> eta: soon™`,
    ls: () => Object.keys(files).map(f => `<span class="f">${f}</span>`).join('    '),
    cat: a => {
      if (!a) return 'usage: cat &lt;file&gt;';
      if (!(a in files)) return `cat: ${esc(a)}: no such file`;
      if (files[a] === null) return `cat: ${esc(a)}: permission denied. nice try.`;
      return esc(files[a]);
    },
    echo: a => esc(a),
    date: () => esc(new Date().toString()),
    coffee: () => '☕ brewing... done. productivity +10',
    clear: () => { out.innerHTML = ''; return null; },
    sudo: () => 'nice try. this incident will be reported to /dev/null.',
    rm: () => 'whoa. not today.',
    exit: () => 'there is no exit. only refresh.',
    vim: () => 'you are now in vim. good luck. (kidding.)',
    hello: () => 'hey there 👋',
    hi: () => 'hey there 👋',
    pwd: () => '/home/visitor',
    cd: () => 'you are exactly where you need to be.',
    madboss: () => 'that’s the name. the game is coming soon.'
  };
  const visible = ['help', 'whoami', 'status', 'ls', 'cat', 'echo', 'date', 'coffee', 'clear'];

  const hist = [];
  let hi = 0;

  const run = raw => {
    line(PS1 + esc(raw));
    const v = raw.trim();
    if (!v) return;
    hist.push(v); hi = hist.length;
    const [name, ...rest] = v.split(/\s+/);
    const fn = cmds[name.toLowerCase()];
    if (!fn) { line(`command not found: ${esc(name)}. try <b>help</b>`, 'err'); return; }
    const res = fn(rest.join(' '));
    if (res != null) line(res);
  };

  form.addEventListener('submit', e => {
    e.preventDefault();
    const raw = input.value;
    input.value = '';
    run(raw);
    input.scrollIntoView({ block: 'nearest' });
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' && hist.length) {
      e.preventDefault(); hi = Math.max(0, hi - 1); input.value = hist[hi];
    } else if (e.key === 'ArrowDown' && hist.length) {
      e.preventDefault(); hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || '';
    } else if (e.key === 'Tab') {
      const v = input.value.trim().toLowerCase();
      if (!v) return;
      e.preventDefault();
      if (v.startsWith('cat ')) {
        const part = v.slice(4);
        const m = Object.keys(files).filter(f => f.startsWith(part));
        if (m.length === 1) input.value = 'cat ' + m[0];
      } else {
        const m = visible.filter(c => c.startsWith(v));
        if (m.length === 1) input.value = m[0] + ' ';
        else if (m.length > 1) { line(PS1 + esc(input.value)); line(m.join('    '), 'muted'); }
      }
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); out.innerHTML = '';
    }
  });

  term.addEventListener('click', () => {
    if (!form.hidden && !getSelection().toString()) input.focus({ preventScroll: true });
  });

  document.addEventListener('keydown', e => {
    if (form.hidden || document.activeElement === input) return;
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) input.focus({ preventScroll: true });
  });

  const typeCmd = async cmd => {
    const d = line(PS1);
    for (const ch of cmd) { d.insertAdjacentText('beforeend', ch); await sleep(40 + Math.random() * 55); }
    await sleep(260);
  };

  const boot = async () => {
    await sleep(500);
    await typeCmd('./deploy --prod');
    line('<span class="ok">[ ok ]</span> scaffolding project'); await sleep(260);
    line('<span class="ok">[ ok ]</span> picking the right purple'); await sleep(260);
    line('<span class="ok">[ ok ]</span> brewing coffee'); await sleep(260);
    const p = line('<span class="run">[ .. ]</span> building the thing <span class="bar"></span> <span class="pct"></span>');
    const pb = p.querySelector('.bar'), pp = p.querySelector('.pct');
    for (let i = 0; i <= 72; i += 3) { pb.textContent = bar(i); pp.textContent = i + '%'; await sleep(45); }
    await sleep(300);
    line('<span class="warn">[wait]</span> eta: soon™');
    line('');
    line('<span class="hint muted">type <b>help</b> to look around.</span>');
    form.hidden = false;
    term.scrollTop = term.scrollHeight;
    if (matchMedia('(pointer: fine)').matches) input.focus({ preventScroll: true });
  };
  boot();

  if (!reduce) {
    setInterval(() => {
      title.classList.add('glitch');
      setTimeout(() => title.classList.remove('glitch'), 420);
    }, 5200);
  }
})();
</script>
</body>
</html>
